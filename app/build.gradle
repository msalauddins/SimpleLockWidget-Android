apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
try {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} catch (FileNotFoundException ignored) {
    logger.warn('keystore.properties not found - setting junk properties')

    keystoreProperties.setProperty('storeFile', 'junk')
    keystoreProperties.setProperty('storePassword', 'junk')
    keystoreProperties.setProperty('keyAlias', 'junk')
    keystoreProperties.setProperty('keyPassword', 'junk')
}

android {
    namespace "com.github.shingyx.lockwidget"
    compileSdk 36

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }
    defaultConfig {
        applicationId "com.github.shingyx.lockwidget"
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        debug {
            debuggable false
            signingConfig signingConfigs.debugConfig
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
